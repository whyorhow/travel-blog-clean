<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="msapplication-navbutton-color" content="#000000" />

  <!-- Basic SEO -->
  <title>Nomad Scribbles | Travel Stories Across Brazil & Beyond</title>
  <meta name="description"
    content="Nomad Scribbles is a creative travel blog sharing slow-travel stories, photography, and reflections from Brazil and beyond." />
  <meta name="author" content="Nomad Scribbles" />

  <!-- Open Graph (social sharing) -->
  <meta property="og:title" content="Nomad Scribbles | Travel Stories Across Brazil & Beyond" />
  <meta property="og:description" content="Creative travel writing, art, and culture from Brazil and beyond." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.nomadscribbles.com/" />
  <meta property="og:image" content="https://www.nomadscribbles.com/images/default-share.png" />

  <!-- Twitter card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Nomad Scribbles | Travel Stories Across Brazil & Beyond" />
  <meta name="twitter:description" content="Creative travel writing, art, and culture from Brazil and beyond." />
  <meta name="twitter:image" content="https://www.nomadscribbles.com/images/default-share.png" />

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
  <link rel="icon" type="image/png" sizes="96x96" href="%PUBLIC_URL%/favicon-96x96.png" />
  <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/assets/favicon.png" />
  <link rel="manifest" href="%PUBLIC_URL%/site.webmanifest" />

  <!-- Fonts are self-hosted via @fontsource (see src/index.js) -->
  <link rel="preload" as="image" href="%PUBLIC_URL%/assets/LogoV5.svg" fetchpriority="high" />
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <!-- Static LCP shell — visible before JS; replaced when React mounts -->
  <div id="root">
    <div id="static-lcp-shell" style="margin:0;min-height:100vh;background-color:#2e1208;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 0;box-sizing:border-box">
      <img src="%PUBLIC_URL%/assets/LogoV5.svg" alt="Nomad Scribbles" width="1815" height="311" fetchpriority="high" decoding="async" style="width:95%;max-width:56rem;height:auto;object-fit:contain;display:block" />
    </div>
  </div>
</body>

</html>
