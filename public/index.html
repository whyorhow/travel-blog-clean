<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="msapplication-navbutton-color" content="#000000" />

  <!-- Basic SEO -->
  <title>Nomad Scribbles | Travel Stories Across Brazil & Beyond</title>
  <meta name="description"
    content="Nomad Scribbles is a creative travel blog sharing slow-travel stories, photography, and reflections from Brazil and beyond." />
  <meta name="author" content="Nomad Scribbles" />

  <!-- Open Graph (social sharing) -->
  <meta property="og:title" content="Nomad Scribbles | Travel Stories Across Brazil & Beyond" />
  <meta property="og:description" content="Creative travel writing, art, and culture from Brazil and beyond." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.nomadscribbles.com/" />
  <meta property="og:image" content="https://www.nomadscribbles.com/images/default-share.png" />

  <!-- Twitter card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Nomad Scribbles | Travel Stories Across Brazil & Beyond" />
  <meta name="twitter:description" content="Creative travel writing, art, and culture from Brazil and beyond." />
  <meta name="twitter:image" content="https://www.nomadscribbles.com/images/default-share.png" />

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
  <link rel="icon" type="image/png" sizes="96x96" href="%PUBLIC_URL%/favicon-96x96.png" />
  <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/assets/favicon.png" />
  <link rel="manifest" href="%PUBLIC_URL%/site.webmanifest" />

  <!-- Fonts are self-hosted via @fontsource (see src/index.js) -->
  <link rel="preload" as="image" href="%PUBLIC_URL%/assets/LogoHero-800.webp" fetchpriority="high" type="image/webp" />

  <!-- Homepage static shell styles (see scripts/homeStaticShell.js) -->
  <style>
    .home-shell{background:#2e1208;min-height:100vh;overflow-x:hidden;width:100%;margin:0;box-sizing:border-box}
    .home-hero{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:2rem 1rem 2rem;box-sizing:border-box;width:100%;min-height:65vh}
    .home-shell-logo{width:95%;max-width:56rem;height:auto;object-fit:contain;display:block;filter:drop-shadow(0 25px 25px rgba(0,0,0,0.15))}
    .home-torn{height:clamp(40px,6vw,60px);line-height:0;margin:0;background:#50473e}
    .home-explore{min-height:50vh;background:#292524;margin:0}
    @media (min-width:768px){
      .home-hero{min-height:1100px;padding-top:4rem;padding-bottom:2rem}
    }
  </style>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <!-- Static shell phase-1 — matches HomeNew first paint; replaced when React mounts -->
  <div id="root">
    <div class="home-shell">
      <section class="home-hero">
        <img src="%PUBLIC_URL%/assets/LogoHero-800.webp" srcset="%PUBLIC_URL%/assets/LogoHero-800.webp 800w, %PUBLIC_URL%/assets/LogoHero.webp 1200w" sizes="(max-width:768px) 95vw, 56rem" alt="Nomad Scribbles" width="1200" height="206" fetchpriority="high" decoding="async" class="home-shell-logo" />
      </section>
      <div class="home-torn" aria-hidden="true"></div>
      <section class="home-explore" id="explore" aria-hidden="true"></section>
    </div>
  </div>
</body>

</html>
